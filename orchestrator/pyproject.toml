[project]
name = "moira-orchestrator"
version = "0.1.0"
description = "Moira — governed agent orchestration core (v0.1 spike)"
requires-python = ">=3.11"
# Core has ZERO runtime dependencies (stdlib only) — by design, so the spike
# installs and runs anywhere with no friction.
dependencies = []

[project.optional-dependencies]
# Optional extras — each lazy-imported only on its path. The core + offline test
# suite + local-mode auth stay stdlib-only (zero deps), by design.
database = [
    "psycopg[binary]>=3.0",  # PostgreSQL primary store (MOIRA_PRIMARY=postgres)
]
auth = [
    "PyJWT[crypto]>=2.6",    # OIDC identity verification (MOIRA_AUTH_MODE=oidc)
]
backends = [
    "litellm>=1.40",     # multi-model routing (frontier + local Ollama)
]
engine = [
    "langgraph>=0.2",    # target orchestration engine (ADR-002), v0.2
]
dev = [
    "pytest>=8",
]

[project.scripts]
moira = "moira_cli:main"
moira-runner = "moira_runner:main"

[tool.setuptools]
py-modules = ["moira_cli", "moira_runner"]
packages = ["moira_core", "moira_core.backends"]
